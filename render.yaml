# Free SIH demo deployment. Render's free PostgreSQL database expires after 30 days.
# Both React and the Python API are served by this one web service.
services:
  - type: web
    name: schemesathi-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: schemesathi-db
          property: connectionString
      - key: PUBLIC_SITE_URL
        fromService:
          type: web
          name: schemesathi-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        value: '[]'
      - key: ENV
        value: production
      - key: SUPPORT_EMAIL
        value: customercareprashasti@gmail.com
      - key: SMS_PROVIDER
        value: firebase

databases:
  - name: schemesathi-db
    plan: free
    region: singapore
    databaseName: schemesathi
    ipAllowList: []
